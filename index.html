<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eatery Glass Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<style>

/* Layout: glass sidebar + 12-column card grid; cards land in reading order, pages cross-fade. Single dark look by choice. */
:root{
  --bg:#0c0e0f; --ink:#f2eee8; --muted:#9a948b; --accent:#e8642c;
  --good:#4cc38a; --warn:#f0b445; --bad:#ef5b5b;
  --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.09); --edge:rgba(255,255,255,.11);
  --f-display:"Bricolage Grotesque",system-ui,sans-serif; --f-body:"Figtree",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;
  min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 50% at 80% 8%,rgba(232,100,44,.20),transparent 70%),
             radial-gradient(50% 45% at 8% 90%,rgba(76,195,138,.10),transparent 70%),
             radial-gradient(40% 40% at 50% 50%,rgba(255,255,255,.03),transparent 70%)}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;max-width:1320px;margin:0 auto}
.glass{background:var(--glass);border:1px solid var(--edge);border-radius:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
aside{padding:16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:16px;align-self:start;height:calc(100vh - 32px);max-height:640px}
.brand{display:flex;gap:10px;align-items:center;font:700 18px var(--f-display)}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.brand small{display:block;font:400 11px var(--f-body);color:var(--muted)}
nav{display:flex;flex-direction:column;gap:4px}
nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:500;transition:background .25s,color .25s}
nav a:hover{background:var(--glass-2);color:var(--ink)}
nav a[aria-current=page]{background:var(--accent);color:#fff}
nav a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
nav svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;background:var(--glass);font-size:12px;color:var(--muted)}
.side-foot b{display:block;color:var(--ink);font:700 16px var(--f-display);font-variant-numeric:tabular-nums}
main{min-width:0;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;padding:6px 4px}
header small{color:var(--muted)}
h1{margin:0;font:700 clamp(24px,4vw,34px)/1.1 var(--f-display);text-wrap:balance}
.pill{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:99px;border:1px solid var(--edge);background:var(--glass);font-size:12px;color:var(--muted)}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.card{padding:18px;min-width:0}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card h2{margin:0 0 2px;font:600 15px var(--f-display)}
.card .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.kpi .v{font:700 clamp(24px,3vw,30px)/1.1 var(--f-display);font-variant-numeric:tabular-nums;margin:8px 0 6px}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.07em}
.delta{font-size:12px;font-weight:600}.delta.up{color:var(--good)}.delta.down{color:var(--bad)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg text{fill:var(--muted);font:11px var(--f-body)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px}
.bars{display:flex;flex-direction:column;gap:13px}
.track{height:8px;border-radius:9px;background:var(--glass-2);overflow:hidden;margin-top:6px}
.fill{height:100%;border-radius:9px;background:var(--accent)}
.fill.g{background:var(--good)}.fill.w{background:var(--warn)}.fill.b{background:var(--bad)}
.cols{display:flex;align-items:end;gap:8px;height:170px;padding-top:8px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:6px;height:100%}
.col .bar{width:100%;border-radius:8px 8px 3px 3px;background:var(--glass-2);transition:background .2s}
.col .bar.hi{background:var(--accent)}
.col span{font-size:11px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;background:var(--glass)}
.item .dot{width:9px;height:9px;border-radius:50%;flex:none}
.item p{margin:0;flex:1;min-width:0}.item p small{display:block;color:var(--muted)}
.ring{display:grid;place-items:center;position:relative}
.ring b{position:absolute;font:700 28px var(--f-display);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th{color:var(--muted);font-weight:500;text-align:right;padding:8px 10px;border-bottom:1px solid var(--edge);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
td{padding:10px;text-align:right;border-bottom:1px solid var(--edge)}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;height:auto;max-height:none;flex-direction:row;padding:8px max(12px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px));border-radius:18px 18px 0 0;background:rgba(18,20,21,.82)}
  .brand,.side-foot{display:none}
  nav{flex-direction:row;flex:1;justify-content:space-around}
  nav a{flex-direction:column;gap:3px;font-size:11px;padding:7px 12px}
  main{padding-bottom:84px}
  .s4,.s5,.s7,.s8{grid-column:span 12}.s3{grid-column:span 6}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.s6{grid-column:span 6}
@media (max-width:900px){.s6{grid-column:span 12}}
select{font:500 13px var(--f-body);color:var(--ink);background:var(--glass-2);border:1px solid var(--edge);border-radius:99px;padding:7px 12px;cursor:pointer}
select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
select option{background:#1a1d1e;color:var(--ink)}
.hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{color:var(--muted);font-size:12px;margin:12px 0 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.seg{display:inline-flex;gap:4px;padding:3px;border-radius:99px;background:var(--glass);border:1px solid var(--edge);margin-bottom:12px}
.seg button{font:500 12px var(--f-body);color:var(--muted);background:none;border:0;border-radius:99px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.seg button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
tr.sel td{background:var(--glass-2)}
.yc .row{padding:7px 0;border-bottom:1px solid var(--edge)}.yc .row:last-child{border:0}
.gap{font:700 26px var(--f-display);margin:16px 0 0;font-variant-numeric:tabular-nums}.gap.up{color:var(--good)}.gap.down{color:var(--bad)}.gap small{font:600 13px var(--f-body);margin-left:6px}
.cmpbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.cmpbar label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.07em}
svg.chart{touch-action:pan-y;cursor:crosshair}
#tip{position:fixed;z-index:30;pointer-events:none;padding:8px 10px;border-radius:10px;background:rgba(24,27,28,.94);border:1px solid var(--edge);font-size:12px;line-height:1.5;min-width:110px;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#tip b{display:block;margin-bottom:2px;font:600 12px var(--f-body)}#tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}#tip span{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.story{margin:0 0 10px;line-height:1.6;max-width:78ch}.story b{font-weight:600}
input[type=date]{font:500 13px var(--f-body);color:var(--ink);background:var(--glass-2);border:1px solid var(--edge);border-radius:99px;padding:6px 12px}
input[type=date]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.col b{font:600 10px var(--f-body);color:var(--ink);font-variant-numeric:tabular-nums}
.insg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin-top:12px}
.ins{padding:12px 14px;border-radius:14px;background:var(--glass-2);border-left:3px solid var(--muted)}
.ins small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.ins b{display:block;font:600 16px var(--f-display);margin:4px 0 4px}
.ins p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}
.gate{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(10,12,12,.82);backdrop-filter:blur(10px)}
.gate[hidden],#gform[hidden],#gretry[hidden]{display:none}
.gbox{width:min(360px,100%);padding:24px;border-radius:20px;text-align:center}.gbox h2{margin:0 0 8px}.gbox p{color:var(--muted);margin:0 0 16px}
.gbox form{display:flex;gap:8px}.gbox input{flex:1;min-width:0;font:500 14px var(--f-body);color:var(--ink);background:var(--glass-2);border:1px solid var(--edge);border-radius:99px;padding:10px 14px}
.gbox button{font:600 13px var(--f-body);color:#fff;background:var(--accent);border:0;border-radius:99px;padding:10px 18px;cursor:pointer}
.gbox input:focus-visible,.gbox button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;left:-9999px}
.hbtn{font:500 12px var(--f-body);color:var(--ink);background:var(--glass-2);border:1px solid var(--edge);border-radius:99px;padding:7px 12px;cursor:pointer}
.hbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:700px){
  .hd label.pill,#print{display:none}
  .cmpbar{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center}
  .cmpbar select,.cmpbar input{width:100%;min-width:0}
  .seg{border-radius:18px;flex-wrap:wrap}
  nav a{padding:7px 4px;font-size:10.5px}
}
@media print{
  :root{--bg:#fff;--ink:#141414;--muted:#555;--glass:#fff;--glass-2:#f3f3f3;--edge:#ccc}
  body::before,aside,.hd,#tip,.gate{display:none!important}
  .app{display:block}.card{break-inside:avoid;box-shadow:none!important;backdrop-filter:none!important;border:1px solid #ccc}
}
</style>

<div class="app">
  <aside class="glass">
    <div class="brand"><i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M6 3v7a3 3 0 0 0 6 0V3M9 3v18M18 3c-2 2-3 5-3 8h3v10"/></svg></i><div>Eatery<small>October branch</small></div></div>
    <nav id="nav" aria-label="Pages"></nav>
    <div class="side-foot">2026 so far<b id="foot">—</b></div>
  </aside>
  <main>
    <header>
      <div><small id="date"></small><h1 id="title">Overview</h1></div>
      <div class="hd"><label for="month" class="pill">Month</label><select id="month"></select><button id="copy" type="button" class="hbtn">Copy summary</button><button id="print" type="button" class="hbtn">Print / PDF</button></div>
    </header>
    <div id="view" class="grid"></div>
  </main>
</div>

<div id="gate" class="gate" hidden><div class="glass gbox"><h2>Eatery sales</h2><p id="gmsg"></p>
<form id="gform" hidden><label for="gkey" class="sr">Password</label><input id="gkey" type="password" autocomplete="current-password" placeholder="Password"><button type="submit">Open</button></form>
<button id="gretry" type="button" hidden>Try again</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
function boot(DATA){
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const f = n => Math.round(n).toLocaleString('en-US');
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WK = ['Sat','Sun','Mon','Tue','Wed','Thu','Fri'];            // Egyptian week order
const wkIdx = wd => (wd+1)%7;                                       // Mon=1 -> index 2, Sat=6 -> 0
const short = v => v>=1e6 ? (v/1e6).toFixed(1).replace(/\.0$/,'')+'M' : v>=1e3 ? Math.round(v/1e3)+'k' : String(Math.round(v));
const pct = (a,b) => b ? (a/b*100) : 0;

/* ---------- data ---------- */
const months = DATA.months;                    // {y,m,total,guests,visa,cash}
const key = (y,m) => y*100+m;
const idxOf = {}; months.forEach((r,i)=>idxOf[key(r.y,r.m)]=i);
const days = DATA.days.map(([y,m,d,wd,total,guests])=>({y,m,d,wd,total,guests}));
const daysOf = (y,m) => days.filter(x=>x.y===y&&x.m===m);
const lbl = r => MN[r.m-1]+' '+r.y+(r.part?' so far':'');
const itemised = r => r.visa+r.cash+(r.insta||0);
const gapOf = r => Math.max(0, r.total-itemised(r));
const mLabels = months.map(r=>r.m===1?String(r.y):'');
const targets = DATA.targets||{};
let sel = months.map(r=>!r.part).lastIndexOf(true); if(sel<0) sel=months.length-1;   // default to the last complete month

/* ---------- pieces ---------- */
const REG=[]; const reg=c=>REG.push(c)-1;
function niceMax(v){ const p=Math.pow(10,Math.floor(Math.log10(v))); for(const s of [1,1.5,2,2.5,3,4,5,6,8,10]) if(s*p>=v*1.02) return s*p; return 10*p; }
function lineChart({series,xlabels,fmt=short,w=640,h=230,aria='Line chart',tips,tipFmt=v=>f(v)}){
  const L=48,R=14,T=12,B=26;
  const all=series.flatMap(s=>s.data.filter(v=>v!=null)); const max=niceMax(Math.max(...all));
  const n=xlabels.length, x=i=>L+i*(w-L-R)/Math.max(n-1,1), y=v=>T+(1-v/max)*(h-T-B);
  const ticks=[0,.25,.5,.75,1].map(t=>max*t);
  const paths=series.map((s,si)=>{
    let d='',last=null;
    s.data.forEach((v,i)=>{ if(v==null){return} d+=(last===i-1&&last!==null?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; last=i; });
    const lastI=s.data.map(v=>v!=null).lastIndexOf(true);
    let area='';
    if(series.length===1){ const first=s.data.findIndex(v=>v!=null); area=`<path class="area" d="${d} L${x(lastI)} ${y(0)} L${x(first)} ${y(0)} Z" fill="url(#ar)"/>`; }
    return area+`<path class="draw" d="${d}" pathLength="1" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(lastI)}" cy="${y(s.data[lastI])}" r="4.5" fill="${s.color}" stroke="#0c0e0f" stroke-width="2"/>`;
  }).join('');
  return `${series.length>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>`:''}
  <svg class="chart" data-cid="${reg({mode:'line',w,h,L,R,T,B,max,n,labels:tips||xlabels,fmt:tipFmt,series:series.map(s=>({name:s.name,color:s.color,vals:s.data}))})}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${aria}">
   <defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8642c" stop-opacity=".38"/><stop offset="1" stop-color="#e8642c" stop-opacity="0"/></linearGradient></defs>
   ${ticks.map(t=>`<line x1="${L}" x2="${w-R}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,.08)"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`).join('')}
   ${xlabels.map((t,i)=>t?`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${t}</text>`:'').join('')}
   ${paths}</svg>`;
}
function ring(p,label){
  const r=52,c=2*Math.PI*r;
  return `<div class="ring"><svg width="140" height="140" viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="${r}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="11"/><circle class="rg" cx="70" cy="70" r="${r}" fill="none" stroke="#e8642c" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 70 70)"/></svg><b>${label}</b></div>`;
}
const firstInsta=(()=>{const r=months.find(x=>x.insta!=null);return r?MN[r.m-1]+' '+r.y:'—'})();
const instaBar=(M,full)=>M.insta==null?[]:[['Instapay',pct(M.insta,M.total),'w',(full?f(M.insta)+' EGP · ':'')+pct(M.insta,M.total).toFixed(1)+'%']];
const bars = rows => `<div class="bars">${rows.map(([n,p,c,txt])=>`<div><div class="row"><span>${n}</span><span>${txt}</span></div><div class="track"><div class="fill ${c||''}" style="width:${Math.min(100,Math.max(0,p))}%"></div></div></div>`).join('')}</div>`;
const delta = (cur,prev) => prev ? `<span class="delta ${cur>=prev?'up':'down'}">${cur>=prev?'▲':'▼'} ${Math.abs((cur/prev-1)*100).toFixed(1)}%</span> <span class="sub">vs last month</span>` : `<span class="sub">First month in the data</span>`;
const kpi = (l,val,sub,count) => `<div class="card glass kpi s3"><div class="l">${l}</div><div class="v" ${count||''}>${val}</div>${sub}</div>`;
const cols = rows => `<div class="cols">${rows.map(([n,v,t,hi])=>`<div class="col"><b>${t}</b><div class="bar ${hi?'hi':''}" style="height:${Math.max(v,2)}%"></div><span>${n}</span></div>`).join('')}</div>`;
const weekdayCols = (ds,field) => {
  const sum=Array(7).fill(0),cnt=Array(7).fill(0);
  ds.forEach(x=>{const i=wkIdx(x.wd);sum[i]+=x[field];cnt[i]++});
  const avg=sum.map((s,i)=>cnt[i]?s/cnt[i]:0), mx=Math.max(...avg);
  return cols(WK.map((n,i)=>[n,avg[i]/mx*100,short(avg[i]),avg[i]===mx]));
};
const dayName = x => WK[wkIdx(x.wd)]+' '+x.d;

const METRICS={sales:{name:'Sales',val:r=>r.total,fmt:short,unit:'EGP'},guests:{name:'Guests',val:r=>r.guests,fmt:short,unit:''},check:{name:'Average check',val:r=>r.total/r.guests,fmt:v=>f(v),unit:'EGP'}};
let metric='sales';
const cmp={m:months[months.length-1].m,b:months[months.length-1].y,a:months[months.length-1].y-1,mode:'date'};
function normCmp(){const ys=YRS.filter(y=>monthRec(y,cmp.m)); if(!ys.includes(cmp.b)) cmp.b=ys[ys.length-1]; if(!ys.includes(cmp.a)||cmp.a===cmp.b) cmp.a=ys.find(y=>y!==cmp.b)||cmp.b;}
const monthRec=(y,m)=>{const i=idxOf[key(y,m)];return i==null?null:months[i]};
const YRS=[2024,2025,2026], YC={2024:'#9a948b',2025:'#f0b445',2026:'#e8642c'};
const yoyTxt=(c,p)=>p?`<span class="delta ${c>=p?'up':'down'}">${c>=p?'▲':'▼'} ${Math.abs((c/p-1)*100).toFixed(1)}%</span>`:'<span class="sub">—</span>';

function divBars(diffs,fmt,aria,tips,tipFmt){
  const w=640,h=210,L=48,R=14,T=12,B=26,n=diffs.length;
  const mx=niceMax(Math.max(...diffs.filter(v=>v!=null).map(Math.abs),1)), mid=(T+h-B)/2, half=(h-B-T)/2, bw=(w-L-R)/n, y=v=>mid-v/mx*half;
  const xl=(i)=>[1,8,15,22,n].includes(i+1)?`<text x="${L+bw*(i+.5)}" y="${h-6}" text-anchor="middle">${i+1}</text>`:'';
  return `<svg class="chart" data-cid="${reg({mode:'bar',w,h,L,R,T,B,max:mx,n,labels:tips||diffs.map((_,i)=>'Day '+(i+1)),fmt:tipFmt||fmt,series:[{name:'Difference',color:'#e8642c',vals:diffs}]})}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${aria}">

function insights(months,days,sel){
  const M=months[sel], out=[], ab=Math.abs, sg=v=>v>=0?'+':'−', mon=MN[M.m-1];
  const rec=(y,m)=>months[idxOf[key(y,m)]], pc=(a,b)=>(a/b-1)*100;
  const Y=rec(M.y-1,M.m);
  if(Y){
    const d=M.total-Y.total, gE=(M.guests-Y.guests)*(Y.total/Y.guests), cE=d-gE;
    out.push([d>=0?'good':'bad',`Vs ${mon} ${Y.y}`,`Sales ${sg(d)}${ab(pc(M.total,Y.total)).toFixed(1)}%`,
      `${ab(gE)>=ab(cE)?'Mostly guests':'Mostly average check'}: guests ${sg(M.guests-Y.guests)}${ab(pc(M.guests,Y.guests)).toFixed(1)}%, average check ${sg(M.total/M.guests-Y.total/Y.guests)}${ab(pc(M.total/M.guests,Y.total/Y.guests)).toFixed(1)}%.`]);
  }
  const cur=months.filter(r=>r.y===M.y&&r.m<=M.m), prv=months.filter(r=>r.y===M.y-1&&r.m<=M.m), sum=a=>a.reduce((t,r)=>t+r.total,0);
  if(cur.length>1&&prv.length===cur.length)
    out.push([sum(cur)>=sum(prv)?'good':'bad',`${M.y} so far`,`Year to date ${sg(sum(cur)-sum(prv))}${ab(pc(sum(cur),sum(prv))).toFixed(1)}%`,`${short(sum(cur))} vs ${short(sum(prv))} EGP, Jan to ${mon}.`]);
  let n=0,dir=null;
  for(let i=sel;i>=0;i--){const r=months[i],y=rec(r.y-1,r.m); if(!y) break; const up=r.total>=y.total; if(dir===null) dir=up; if(up!==dir) break; n++;}
  if(n>=2) out.push([dir?'good':'bad','Momentum',`${n} months in a row ${dir?'above':'below'} last year`,`Sales, same month compared, up to ${mon} ${M.y}.`]);
  const rank=months.filter(r=>r.total>M.total).length+1, N=months.length;
  out.push([rank<=3?'good':rank>N-3?'bad':'info','Rank',`#${rank} of ${N} months`,`${mon} ${M.y} sales compared with every month since ${MN[months[0].m-1]} ${months[0].y}.`]);
  const by={}; days.filter(x=>x.y===M.y&&x.m===M.m).forEach(x=>(by[x.wd]=by[x.wd]||[]).push(x.total));
  const av=Object.keys(by).map(k=>[+k,by[k].reduce((a,b)=>a+b,0)/by[k].length]).sort((a,b)=>b[1]-a[1]);
  if(av.length>1) out.push(['info','Weekdays',`${WK[wkIdx(av[0][0])]} is the strongest day`,`Average ${f(av[0][1])} EGP, against ${f(av[av.length-1][1])} on ${WK[wkIdx(av[av.length-1][0])]}.`]);
  if(Y&&M.cash!=null&&Y.cash!=null){const a=pct(M.cash,M.total),b=pct(Y.cash,Y.total);
    out.push(['info','Payments',`Cash is ${a.toFixed(1)}% of sales`,`${sg(a-b)}${ab(a-b).toFixed(1)} points vs ${mon} ${Y.y}.`]);}
  return out;
}

/*LOGIC*/
const L_dim=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
const L_wd=(y,m,d)=>new Date(Date.UTC(y,m-1,d)).getUTCDay()||7;
const L_mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const L_sum=(a,k)=>a.reduce((s,x)=>s+x[k],0);
const L_add=(k,n)=>{const d=new Date(Date.UTC(Math.floor(k/10000),Math.floor(k/100)%100-1,k%100+n));return d.getUTCFullYear()*10000+(d.getUTCMonth()+1)*100+d.getUTCDate()};
const L_key=x=>x.y*10000+x.m*100+x.d;
const dayLbl=x=>WK[wkIdx(x.wd)]+' '+x.d+' '+MN[x.m-1];

/* things worth a look: the latest day against its usual weekday, the last 7 days, and the cash share */
function alerts(months,days){
  const out=[], n=days.length; if(n<8) return out;
  const L=days[n-1], same=days.slice(0,n-1).filter(x=>x.wd===L.wd).slice(-8), W=WK[wkIdx(L.wd)], P=v=>Math.abs(v*100).toFixed(0)+'%';
  if(same.length>=3){
    const aT=L_mean(same.map(x=>x.total)), aG=L_mean(same.map(x=>x.guests)), withG=same.filter(x=>x.guests>0), aC=L_mean(withG.map(x=>x.total/x.guests));
    const dT=L.total/aT-1, dG=aG?L.guests/aG-1:0, dC=L.guests>0&&aC?(L.total/L.guests)/aC-1:0;
    if(dT<=-.3) out.push(['bad',`${dayLbl(L)} sales were ${P(dT)} below a usual ${W}`,`${f(L.total)} EGP, against an average of ${f(aT)} over the last ${same.length} ${W}s.`]);
    else if(dT>=.3) out.push(['good',`${dayLbl(L)} sales were ${P(dT)} above a usual ${W}`,`${f(L.total)} EGP, against an average of ${f(aT)} over the last ${same.length} ${W}s.`]);
    if(dG<=-.2) out.push(['warn',`${dayLbl(L)} had ${P(dG)} fewer guests than a usual ${W}`,`${f(L.guests)} guests, against an average of ${f(aG)}.`]);
    if(dC<=-.15) out.push(['warn',`Average check on ${dayLbl(L)} was ${P(dC)} lower than usual`,`${f(L.total/L.guests)} EGP, against an average of ${f(aC)}.`]);
  }
  if(n>=14){
    const a=days.slice(-7), b=days.slice(-14,-7), dT=L_sum(a,'total')/L_sum(b,'total')-1, dG=L_sum(a,'guests')/L_sum(b,'guests')-1;
    if(dT<=-.15) out.push(['bad',`Last 7 days sales are down ${P(dT)}`,`${short(L_sum(a,'total'))} against ${short(L_sum(b,'total'))} EGP in the 7 days before.`]);
    else if(dT>=.15) out.push(['good',`Last 7 days sales are up ${P(dT)}`,`${short(L_sum(a,'total'))} against ${short(L_sum(b,'total'))} EGP in the 7 days before.`]);
    if(dG<=-.15) out.push(['warn',`Last 7 days guests are down ${P(dG)}`,`${f(L_sum(a,'guests'))} against ${f(L_sum(b,'guests'))} in the 7 days before.`]);
  }
  const done=months.filter(r=>!r.part);
  if(done.length>=4){const M=done[done.length-1], a=pct(M.cash,M.total), b=L_mean(done.slice(-4,-1).map(r=>pct(r.cash,r.total)));
    if(a-b>=5) out.push(['warn',`Cash share is up to ${a.toFixed(1)}%`,`${(a-b).toFixed(1)} points above the average of the 3 months before (${b.toFixed(1)}%).`]);}
  if(!out.length) out.push(['good','Nothing unusual',`${dayLbl(L)} and the last 7 days are in the normal range.`]);
  return out;
}

/* newest month: forecast and target progress while it is still running, target result once it is over */
function outlook(months,days,targets){
  const R=months[months.length-1]; if(!R) return null;
  const dim=L_dim(R.y,R.m), ds=days.filter(x=>x.y===R.y&&x.m===R.m), done=ds.length, tg=targets[R.y*100+R.m]||null, label=MN[R.m-1]+' '+R.y;
  if(done>=dim) return tg?{kind:'done',label,total:R.total,target:tg,pct:R.total/tg*100}:null;
  const lastD=ds[ds.length-1].d, recent=days.slice(-56), by={};
  recent.forEach(x=>(by[x.wd]=by[x.wd]||[]).push(x.total));
  const all=L_mean(recent.map(x=>x.total));
  let rest=0; for(let d=lastD+1;d<=dim;d++){const w=by[L_wd(R.y,R.m,d)]; rest+=w?L_mean(w):all}
  const so=L_sum(ds,'total'), left=dim-lastD, fc=so+rest, ya=months[idxOf[key(R.y-1,R.m)]];
  return {kind:'open',label,done,dim,left,soFar:so,forecast:fc,target:tg,pctTarget:tg?so/tg*100:null,need:tg?Math.max(0,(tg-so)/left):null,
    avgSoFar:so/done,yoy:ya&&!ya.part?(fc/ya.total-1)*100:null,hit:tg?fc>=tg:null};
}

/* best and worst days, weekdays, season, Ramadan */
const RAMADAN=[[2024,20240311,20240409],[2025,20250301,20250329],[2026,20260218,20260319]];   // approximate start and end of the fast
function patterns(months,days){
  const real=days.filter(x=>x.total>0&&x.guests>0), sorted=[...real].sort((a,b)=>b.total-a.total);
  const wdStat=ds=>{const by={};ds.forEach(x=>(by[x.wd]=by[x.wd]||[]).push(x));
    return [6,7,1,2,3,4,5].filter(w=>by[w]).map(w=>({wd:w,t:L_mean(by[w].map(x=>x.total)),g:L_mean(by[w].map(x=>x.guests)),n:by[w].length}))};
  // season: sales per day of each complete month, as an index of that year's average (100 = average month of the year)
  const done=months.filter(r=>!r.part), yAvg={};
  [...new Set(done.map(r=>r.y))].forEach(y=>{yAvg[y]=L_mean(done.filter(r=>r.y===y).map(r=>r.total/L_dim(r.y,r.m)))});
  const season=MN.map((_,i)=>{const v=done.filter(r=>r.m===i+1).map(r=>r.total/L_dim(r.y,r.m)/yAvg[r.y]*100); return v.length?{m:i+1,idx:L_mean(v),n:v.length}:null}).filter(Boolean);
  const ram=[]; RAMADAN.forEach(([y,s,e])=>{
    const inn=days.filter(x=>L_key(x)>=s&&L_key(x)<=e), bef=days.filter(x=>L_key(x)>=L_add(s,-30)&&L_key(x)<s);
    if(inn.length>=20&&bef.length>=20) ram.push({y,t:L_mean(inn.map(x=>x.total)),tb:L_mean(bef.map(x=>x.total)),g:L_mean(inn.map(x=>x.guests)),gb:L_mean(bef.map(x=>x.guests))});});
  return {top:sorted.slice(0,5),bottom:sorted.slice(-5).reverse(),wdAll:wdStat(real),wdYear:wdStat(real.slice(-365)),season,ram};
}

/* ---------- motion: cards land in reading order ---------- */
function landCards(cards,{y=26,stagger=.06,delay=0}={}){
  if(reduce||!window.gsap||!cards.length) return;
  const tl=gsap.timeline({delay});
  tl.fromTo(cards,{opacity:0,y,scale:.985},{opacity:1,y:0,scale:1,duration:.8,ease:'expo.out',stagger,clearProps:'transform,opacity'});
  const q=s=>view.querySelectorAll(s);
  q('[data-count]').forEach(el=>{
    const to=+el.dataset.count,dec=+el.dataset.dec||0,suf=el.dataset.suf||'',o={v:0};
    gsap.to(o,{v:to,duration:1.3,delay:delay+.15,ease:'power3.out',onUpdate:()=>{el.textContent=o.v.toLocaleString('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf}});
  });
  if(q('.draw').length) gsap.fromTo(q('.draw'),{strokeDasharray:1,strokeDashoffset:1},{strokeDashoffset:0,duration:1.4,delay:delay+.3,ease:'power2.inOut',clearProps:'strokeDasharray,strokeDashoffset'});
  if(q('.dv').length) gsap.from(q('.dv'),{opacity:0,duration:.5,delay:delay+.4,stagger:.015});
  if(q('.area').length) gsap.from(q('.area'),{opacity:0,duration:1,delay:delay+.9});
  if(q('.fill').length) gsap.from(q('.fill'),{scaleX:0,transformOrigin:'0 50%',duration:1,delay:delay+.35,ease:'expo.out',stagger:.08,clearProps:'transform'});
  if(q('.bar').length) gsap.from(q('.bar'),{scaleY:0,transformOrigin:'50% 100%',duration:.9,delay:delay+.3,ease:'expo.out',stagger:.04,clearProps:'transform'});
  q('.rg').forEach(c=>{const da=c.getAttribute('stroke-dasharray');gsap.fromTo(c,{strokeDasharray:'0 999'},{strokeDasharray:da,duration:1.3,delay:delay+.3,ease:'expo.out'})});
}

/* ---------- chart tooltips: hover on desktop, touch and drag on phone ---------- */
const tip=document.createElement('div'); tip.id='tip'; document.body.appendChild(tip);
const NS='http://www.w3.org/2000/svg';
function hideTip(){ tip.style.display='none'; view.querySelectorAll('.hv').forEach(e=>e.remove()); }
function showTip(svg,e){
  const c=REG[+svg.dataset.cid]; if(!c) return hideTip();
  const r=svg.getBoundingClientRect(), vx=(e.clientX-r.left)/r.width*c.w, span=c.w-c.L-c.R;
  let i=c.mode==='line'?Math.round((vx-c.L)/span*(c.n-1)):Math.floor((vx-c.L)/(span/c.n));
  i=Math.max(0,Math.min(c.n-1,i));
  const gx=c.mode==='line'?c.L+i*span/Math.max(c.n-1,1):c.L+span/c.n*(i+.5);
  svg.querySelectorAll('.hv').forEach(el=>el.remove());
  const add=(tag,at)=>{const el=document.createElementNS(NS,tag);el.setAttribute('class','hv');for(const k in at)el.setAttribute(k,at[k]);svg.appendChild(el);return el};
  add('line',{x1:gx,x2:gx,y1:c.T,y2:c.h-c.B,stroke:'rgba(255,255,255,.35)','stroke-dasharray':'3 3'});
  const rows=[];
  c.series.forEach(s=>{const v=s.vals[i]; if(v==null) return; rows.push(`<span><span><i style="background:${s.color}"></i>${s.name}</span><b style="display:inline;margin:0">${c.fmt(v)}</b></span>`);
    if(c.mode==='line') add('circle',{cx:gx,cy:c.T+(1-v/c.max)*(c.h-c.T-c.B),r:5,fill:s.color,stroke:'#0c0e0f','stroke-width':2}); });
  tip.innerHTML=`<b>${c.labels[i]}</b>${rows.join('')}`;
  tip.style.display='block';
  const px=r.left+gx/c.w*r.width, tw=tip.offsetWidth;
  let left=px+14; if(left+tw>innerWidth-8) left=px-tw-14;
  tip.style.left=Math.max(8,left)+'px'; tip.style.top=Math.max(8,r.top+6)+'px';
}
view.addEventListener('pointermove',e=>{const s=e.target.closest('svg.chart'); s?showTip(s,e):hideTip();});
view.addEventListener('pointerdown',e=>{const s=e.target.closest('svg.chart'); s?showTip(s,e):hideTip();});
view.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse') hideTip();});

function go(k,first,force){

}

// A date may arrive as 'yyyy-MM-dd' or as an ISO timestamp of local midnight (e.g. 08:00Z = midnight in a zone west of UTC, 22:00Z = midnight east of it).
function ymd(v){
  const t=String(v), iso=t.match(/^(\d{4})-(\d{2})-(\d{2})T(\d{2})/);
  if(!iso) return t.split('-').map(Number);
  const u=new Date(Date.UTC(+iso[1],+iso[2]-1,+iso[3]+(+iso[4]>=12?1:0)));
  return [u.getUTCFullYear(),u.getUTCMonth()+1,u.getUTCDate()];
}
function toData(j){
  const num=v=>v===''||v==null?null:+v, live=s=>String(s).trim()!=='Template';
  const days=[], byM={};
  j.daily.forEach(([date,total,visa,cash,insta,guests,status])=>{
    total=num(total); if(total==null||!live(status)) return;
    const [y,m,d]=ymd(date); if(!y||!m||!d) return;
    const wd=new Date(Date.UTC(y,m-1,d)).getUTCDay()||7;            // Mon=1 ... Sun=7
    days.push([y,m,d,wd,total,num(guests)||0]);
    const a=byM[y*100+m]=byM[y*100+m]||{y,m,n:0,total:0,guests:0,visa:null,cash:null,insta:null};
    a.n++; a.total+=total; a.guests+=num(guests)||0;
    [['visa',visa],['cash',cash],['insta',insta]].forEach(([k,v])=>{v=num(v); if(v!=null) a[k]=(a[k]||0)+v});
  });
  days.sort((p,q)=>(p[0]-q[0])||(p[1]-q[1])||(p[2]-q[2]));
  const mon={}; j.monthly.forEach(([y,m,total,visa,cash,insta,guests,status])=>{ if(num(total)!=null&&live(status)) mon[y*100+m]={total:+total,visa:num(visa),cash:num(cash),insta:num(insta),guests:num(guests)}});
  const months=Object.keys(byM).map(Number).sort((p,q)=>p-q).map(k=>{
    const a=byM[k], r=mon[k]||{}, dim=new Date(Date.UTC(a.y,a.m,0)).getUTCDate();
    // monthly sheet wins where it has a number; otherwise rebuild from the daily rows
    const pick=(key,alt)=>r[key]!=null?r[key]:alt;
    return {y:a.y,m:a.m,total:pick('total',a.total),guests:pick('guests',a.guests),visa:pick('visa',a.visa)||0,cash:pick('cash',a.cash)||0,insta:pick('insta',a.insta),part:a.n<dim};
  });
  const tg={}; (j.targets||[]).forEach(([y,m,t])=>{t=num(t); if(t!=null&&+y&&+m) tg[+y*100+ +m]=t});
  return {months,days,targets:tg};
}

(function(){

})();
