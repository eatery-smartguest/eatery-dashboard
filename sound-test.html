<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Water drop sounds</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c0f12;color:#eee;font:16px system-ui,sans-serif}
main{padding:24px;max-width:420px;width:100%;box-sizing:border-box}
h1{font-size:20px;margin:0 0 6px}p{color:#9aa;margin:0 0 18px;font-size:14px}
button{display:block;width:100%;margin:10px 0;padding:16px;border-radius:14px;border:1px solid #2b3238;background:#161b20;color:#fff;font-size:17px;cursor:pointer}
button:active{background:#e8642c}
</style></head><body><main>
<h1>Water drop sounds</h1><p>Press each button and tell me which letter sounds like a water drop.</p>
<button data-v="A">A – Plink (short, high)</button>
<button data-v="B">B – Bloop (bubble)</button>
<button data-v="C">C – Drip with a ripple</button>
<button data-v="D">D – Plop (pitch falls)</button>
<script>
let ctx;
function tone(t,f0,f1,dur,vol,decay,type){
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.linearRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.003);g.gain.exponentialRampToValueAtTime(0.0001,t+decay);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+decay+0.03);
}
const V={
 A(t,r){tone(t,1400*r,2000*r,0.03,0.22,0.09)},
 B(t,r){tone(t,600*r,1100*r,0.07,0.28,0.16)},
 C(t,r){tone(t,1800*r,2300*r,0.025,0.2,0.07);tone(t+0.09,1200*r,1500*r,0.03,0.07,0.1)},
 D(t,r){tone(t,1100*r,650*r,0.06,0.26,0.14)}
};
document.querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown',()=>{
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
  const go=()=>V[b.dataset.v](ctx.currentTime+0.02,0.88+Math.random()*0.24);
  if(ctx.state==='running') go(); else ctx.resume().then(go);
}));
</script></main></body></html>
