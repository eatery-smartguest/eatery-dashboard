<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Water drop sounds</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c0f12;color:#eee;font:16px system-ui,sans-serif}
main{padding:24px;max-width:420px;width:100%;box-sizing:border-box}
h1{font-size:20px;margin:0 0 6px}p{color:#9aa;margin:0 0 18px;font-size:14px}
button{display:block;width:100%;margin:10px 0;padding:16px;border-radius:14px;border:1px solid #2b3238;background:#161b20;color:#fff;font-size:17px;cursor:pointer}
button:active{background:#e8642c}small{color:#789;display:block;text-align:center;margin-top:14px}
</style></head><body><main>
<h1>Real water drop recordings</h1><p>Three real recorded drops. Press each one and tell me which number you like.</p>
<button data-i="1">1 – Drop</button>
<button data-i="2">2 – Drop, deeper</button>
<button data-i="3">3 – Drop, lighter</button>
<small id="st">Loading sounds…</small>
<script>
let ctx; const buf={};
function ac(){ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();return ctx}
async function load(i){const r=await fetch('sounds/drop'+i+'.mp3');buf[i]=await ac().decodeAudioData(await r.arrayBuffer())}
Promise.all([1,2,3].map(load)).then(()=>st.textContent='Ready').catch(()=>st.textContent='Could not load the sounds');
document.querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown',async()=>{
  const c=ac(); if(c.state!=='running') await c.resume();
  const i=b.dataset.i; if(!buf[i]) return;
  const s=c.createBufferSource(), g=c.createGain(); s.buffer=buf[i];
  s.playbackRate.value=0.95+Math.random()*0.1;
  const t=c.currentTime+0.01; g.gain.setValueAtTime(1,t); g.gain.setTargetAtTime(0,t+0.45,0.08);
  s.connect(g); g.connect(c.destination); s.start(t); s.stop(t+1.2);
}));
</script></main></body></html>
